{% extends "base.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'register.css' %}">
{% endblock %}

{% block content %}
    <h2>&#9998; Registration</h2>

    {% if error_message %}
        <p class="error-text" style="color: red; font-weight: bold; margin-bottom: 20px;">
            {{ error_message }}
        </p>
    {% endif %}

    <form method="POST" action="" enctype="multipart/form-data" class="register-form">
        {% csrf_token %}
        <div class="system-container">
            <div class="system-left">
                <div class="ava-container">
                    <img src="{% static 'Hamster Eyes.jpeg' %}" alt="Avatar">
                    <p class="user-id">{{ request.user.username }}</p>
                </div>
                <div class="upload-section">
                    <label class="avatar-label" for="avatar">CHANGE IMAGE</label>
                    <input type="file" name="avatar" id="avatar" style="display:none;">
                </div>
            </div>

            <div class="system-right">
                <div class="form-row">
                    <label>Login</label>
                    <input type="text" name="username" required>
                </div>

                <div class="form-row">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-row">
                    <label>NickName</label>
                    <input type="text" name="nickname">
                </div>

                <div class="form-row">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>

                <div class="form-row">
                    <label>Repeat password</label>
                    <input type="password" name="password_confirm" required>
                </div>
            </div>
        </div>

        <div class="save-section">
            <button type="submit" class="submit-btn">Register!</button>
        </div>
    </form>
{% endblock %}
